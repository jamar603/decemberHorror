# December — Apache sert le statique, proxy /ws et /api vers Node (127.0.0.1:18031)
<VirtualHost *:80>
    ServerName december.147-93-90-144.sslip.io
    DocumentRoot /opt/december/public

    <Directory /opt/december/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /ws  http://127.0.0.1:18031/ws upgrade=websocket timeout=120
    ProxyPassReverse /ws  http://127.0.0.1:18031/ws
    ProxyPass        /api http://127.0.0.1:18031/api
    ProxyPassReverse /api http://127.0.0.1:18031/api

    # Fichiers hashés : cache 1 an. index.html / version.json : jamais en cache.
    <IfModule mod_headers.c>
        <LocationMatch "^/assets/">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </LocationMatch>
        <LocationMatch "^/(index\.html|version\.json)?$">
            Header set Cache-Control "no-cache"
        </LocationMatch>
    </IfModule>
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript text/javascript application/json
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/december-error.log
    CustomLog ${APACHE_LOG_DIR}/december-access.log combined
</VirtualHost>
